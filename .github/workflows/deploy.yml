name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install

      - name: Start or Restart Backend via PM2
        run: |
          pm2 restart dev-radar-api || pm2 start src/index.js --name "dev-radar-api"

      - name: Check Status and Logs
        run: |
          pm2 list
          pm2 logs dev-radar-api --lines 10 --nostream