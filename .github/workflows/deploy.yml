name: Deploy Dev Radar Backend to Target Folder

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Target Folder and Deploy Code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $targetDir = "C:\deployments\dev-radar-api"

          # 1. Folder check karein aur banayein
          if (!(Test-Path -Path $targetDir)) {
              New-Item -ItemType Directory -Path $targetDir -Force
              Write-Output "Folder created at: $targetDir"
          }

          # 2. Files copy karein
          Copy-Item -Path * -Destination $targetDir -Recurse -Force -Exclude "node_modules", ".git"
          Write-Output "Code successfully copied to $targetDir"

          # 3. Target folder mein enter ho kar packages install karein
          Set-Location -Path $targetDir
          npm install

          # 4. PM2 check aur start/restart bina warning crash ke
          $processList = pm2 id dev-radar-api 2>$null
          if ($processList -and $processList.Trim() -ne "[]") {
              Write-Output "App already active, restarting..."
              pm2 restart dev-radar-api
          } else {
              Write-Output "Starting fresh instance..."
              pm2 start src/index.js --name "dev-radar-api"
          }

          pm2 save

      - name: Verify Running App
        shell: powershell
        run: |
          pm2 list