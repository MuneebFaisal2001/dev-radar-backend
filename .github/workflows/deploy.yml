name: Deploy Dev Radar Backend to Target Folder

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Target Folder and Deploy Code
        shell: powershell
        run: |
          $targetDir = "C:\deployments\dev-radar-api"

          # 1. Folder check karein aur create karein
          if (!(Test-Path -Path $targetDir)) {
              New-Item -ItemType Directory -Path $targetDir -Force
              Write-Output "Folder created at: $targetDir"
          }

          # 2. Code copy karein
          Copy-Item -Path * -Destination $targetDir -Recurse -Force -Exclude "node_modules", ".git"
          Write-Output "Code successfully copied to $targetDir"

          # 3. Target folder mein switch karein aur dependencies install karein
          Set-Location -Path $targetDir
          npm install

          # 4. PM2 simple restart or start logic (Bina JSON crash ke)
          pm2 describe dev-radar-api > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Output "App exists in PM2, restarting..."
              pm2 restart dev-radar-api
          } else {
              Write-Output "App not running, starting new instance..."
              pm2 start src/index.js --name "dev-radar-api"
          }

          pm2 save

      - name: Verify Running App
        shell: powershell
        run: |
          pm2 list